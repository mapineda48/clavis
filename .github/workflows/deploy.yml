# Publishes the desired state and proves the result actually works.
#
# The pipeline never connects to the droplet. It writes a bundle and a
# current.json to a private blob container; a systemd timer on the host notices
# within a minute and converges. Rolling back is republishing an older bundle.
#
# The four assertions at the end are the point of this workflow. "The container
# is up" and "HTTP 200" are both worthless here: Traefik serves a self-signed
# certificate rather than crashing when its ACME store is unreadable, and a
# misrouted health probe is answered by the SPA with 200 and some HTML.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit to deploy (defaults to the current one)
        required: false
        type: string
  workflow_run:
    workflows: [Images]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  # Never cancel: two runs finishing out of order would leave the older digest
  # tuple published last.
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and verify
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment: production

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      CLAVIS_APP_FQDN: ${{ vars.CLAVIS_APP_FQDN }}
      CLAVIS_API_FQDN: ${{ vars.CLAVIS_API_FQDN }}
      CLAVIS_AUTH_FQDN: ${{ vars.CLAVIS_AUTH_FQDN }}
      CLAVIS_REALM: ${{ vars.CLAVIS_REALM || 'clavis' }}
      CLAVIS_CERT_RESOLVER: ${{ vars.CLAVIS_CERT_RESOLVER || 'staging' }}
      # A secret rather than a variable: it is a personal address, and this way
      # it is masked if anything ever echoes it.
      CLAVIS_ACME_EMAIL: ${{ secrets.CLAVIS_ACME_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Resolve the commit being deployed
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      # The workflow reads what Terraform owns rather than duplicating it in
      # variables that then drift.
      - name: Read the infrastructure outputs
        working-directory: infra/terraform
        run: |
          terraform init -lockfile=readonly >/dev/null
          {
            echo "CLAVIS_STORAGE_ACCOUNT=$(terraform output -raw storage_account_name)"
            echo "CLAVIS_DEPLOY_CONTAINER=$(terraform output -raw deploy_container)"
            echo "CLAVIS_DEPLOY_PREFIX=$(terraform output -raw deploy_prefix)"
            echo "CLAVIS_ATTACHMENTS_CONTAINER=$(terraform output -raw attachments_container)"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$(terraform output -raw attachments_connection_string)"
          echo "CLAVIS_STORAGE_CONNECTION_STRING=$(terraform output -raw attachments_connection_string)" >> "$GITHUB_ENV"

      # `outputs.imageid` from the build is a LOCAL config id and is not
      # pullable. Resolving the tag here gives the registry digest, which is.
      - name: Resolve image digests
        run: |
          repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          for image in api app auth; do
            ref="ghcr.io/${repo}/${image}:sha-${DEPLOY_SHA}"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{ .Manifest.Digest }}')
            [ -n "$digest" ] || { echo "no digest for $ref"; exit 1; }
            echo "resolved ${image} -> ${digest}"
            var=$(echo "$image" | tr '[:lower:]' '[:upper:]')
            echo "CLAVIS_${var}_IMAGE=ghcr.io/${repo}/${image}@${digest}" >> "$GITHUB_ENV"
          done

      - name: Build the bundle
        env:
          CLAVIS_DATABASE_URL: ${{ secrets.CLAVIS_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          KC_BOOTSTRAP_ADMIN_USERNAME: ${{ secrets.KC_BOOTSTRAP_ADMIN_USERNAME }}
          KC_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}
          KEYCLOAK_API_CLIENT_SECRET: ${{ secrets.KEYCLOAK_API_CLIENT_SECRET }}
          DEMO_ADMIN_EMAIL: ${{ secrets.DEMO_ADMIN_EMAIL }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
          DEMO_MANAGER_PASSWORD: ${{ secrets.DEMO_MANAGER_PASSWORD }}
          DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          KEYCLOAK_SMTP_FROM: ${{ vars.KEYCLOAK_SMTP_FROM }}
          CLAVIS_ADMIN_ALLOWLIST_RAW: ${{ vars.ADMIN_ALLOWED_CIDRS }}
        run: bash scripts/build-deploy-bundle.sh

      - name: Publish to blob storage
        run: |
          base="${CLAVIS_DEPLOY_PREFIX}"
          az storage blob upload --auth-mode login --overwrite \
            --account-name "$CLAVIS_STORAGE_ACCOUNT" --container-name "$CLAVIS_DEPLOY_CONTAINER" \
            --name "${base}/bundles/${DEPLOY_SHA}.tar.gz" --file dist/bundle.tar.gz -o none
          # current.json LAST: until it points at the new bundle, nothing on the
          # host changes, so a failed upload above leaves the running stack alone.
          az storage blob upload --auth-mode login --overwrite \
            --account-name "$CLAVIS_STORAGE_ACCOUNT" --container-name "$CLAVIS_DEPLOY_CONTAINER" \
            --name "${base}/current.json" --file dist/current.json -o none
          echo "published ${DEPLOY_SHA}"

      - name: Wait for the host to converge
        run: bash scripts/wait-for-deploy.sh

      - name: Smoke test
        env:
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
          DEMO_MANAGER_PASSWORD: ${{ secrets.DEMO_MANAGER_PASSWORD }}
          DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
        run: bash scripts/smoke-production.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${DEPLOY_SHA}\` |"
            echo "| App | https://${CLAVIS_APP_FQDN} |"
            echo "| API | https://${CLAVIS_API_FQDN} |"
            echo "| Auth | https://${CLAVIS_AUTH_FQDN} |"
            echo "| Certificate | \`${CLAVIS_CERT_RESOLVER}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
