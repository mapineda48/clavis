# Publishes the desired state and proves the result actually works.
#
# The pipeline never connects to the droplet. It writes a bundle and a
# current.json to a private blob container; a systemd timer on the host notices
# within a minute and converges. Rolling back is republishing an older bundle.
#
# The four assertions at the end are the point of this workflow. "The container
# is up" and "HTTP 200" are both worthless here: Traefik serves a self-signed
# certificate rather than crashing when its ACME store is unreadable, and a
# misrouted health probe is answered by the SPA with 200 and some HTML.
#
# The infrastructure is ephemeral and down most of the time, so `preflight`
# gates everything: with no droplet in the Terraform state the run skips
# cleanly instead of failing halfway through publishing.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit to deploy (defaults to the current one)
        required: false
        type: string
  workflow_run:
    workflows: [Images]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  # Never cancel: two runs finishing out of order would leave the older digest
  # tuple published last.
  group: deploy-production
  cancel-in-progress: false

jobs:
  # `droplet_ipv4` is the signal because `terraform destroy` removes the outputs
  # from the state, the droplet is the resource a deploy actually needs (it is
  # the convergence host and the DNS target), and a half-destroyed state that
  # still holds, say, the attachments container must still read as "no
  # infrastructure".
  #
  # The intent: `workflow_run` fires on every push to main while the stack is
  # down most of the time, so a missing droplet has to be a clean skip rather
  # than a red run. Without this gate the failure surfaced minutes later as
  # `az storage blob upload --account-name ""`, after a bundle carrying every
  # secret had already been built.
  preflight:
    name: Check that the infrastructure exists
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment: production

    outputs:
      exists: ${{ steps.check.outputs.exists }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      # The same ref as `publish`: a dispatch naming an explicit commit would
      # otherwise vet main's infra/terraform while publish deploys that commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      # `output -json` rather than `output -raw … || true`, because the two
      # failures must not look alike: it exits 0 with `{}` when the state simply
      # has no outputs (a real teardown, the clean skip) and non-zero when the
      # state cannot be READ at all — written by a newer Terraform, a transient
      # Azure Storage 5xx, corruption. `|| true` collapsed both into an empty
      # droplet and reported a green skip, silently losing the deploy.
      - name: Look for a droplet in the state
        id: check
        working-directory: infra/terraform
        run: |
          terraform init -lockfile=readonly >/dev/null
          outputs=$(terraform output -json)
          droplet=$(printf '%s' "$outputs" | jq -r '.droplet_ipv4.value // empty')
          if [ -n "$droplet" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "infrastructure is up, droplet ${droplet}"
            exit 0
          fi
          # An absent droplet is a SKIP, not a failure: exit 0 and let `needs`
          # take `publish` down with it.
          echo "exists=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy skipped"
            echo
            echo "No infrastructure is provisioned: the Terraform state holds no droplet."
            echo "Nothing was published. \`Infra apply\` creates it."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish and verify
    needs: preflight
    if: ${{ needs.preflight.outputs.exists == 'true' }}
    runs-on: ubuntu-24.04
    environment: production

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      CLAVIS_APP_FQDN: ${{ vars.CLAVIS_APP_FQDN }}
      CLAVIS_API_FQDN: ${{ vars.CLAVIS_API_FQDN }}
      CLAVIS_AUTH_FQDN: ${{ vars.CLAVIS_AUTH_FQDN }}
      CLAVIS_REALM: ${{ vars.CLAVIS_REALM || 'clavis' }}
      CLAVIS_CERT_RESOLVER: ${{ vars.CLAVIS_CERT_RESOLVER || 'staging' }}
      # A secret rather than a variable: it is a personal address, and this way
      # it is masked if anything ever echoes it.
      CLAVIS_ACME_EMAIL: ${{ secrets.CLAVIS_ACME_EMAIL }}

    steps:
      # For a `workflow_run` event `github.sha` is the head of the default
      # branch AT TRIGGER TIME, not the commit the Images run built. Two pushes
      # in quick succession would make the deploy check out a commit whose
      # images do not exist yet.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the commit being deployed
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      # The workflow reads what Terraform owns rather than duplicating it in
      # variables that then drift. Each output is ASSIGNED to a variable first:
      # inside `echo "VAR=$(terraform output …)"` the substitution's failure is
      # swallowed by echo's own exit 0, so an empty value reaches GITHUB_ENV and
      # only surfaces later as `--account-name ""`.
      - name: Read the infrastructure outputs
        working-directory: infra/terraform
        run: |
          terraform init -lockfile=readonly >/dev/null
          storage_account=$(terraform output -raw storage_account_name)
          deploy_container=$(terraform output -raw deploy_container)
          deploy_prefix=$(terraform output -raw deploy_prefix)
          attachments_container=$(terraform output -raw attachments_container)
          connection_string=$(terraform output -raw attachments_connection_string)
          echo "::add-mask::${connection_string}"
          {
            echo "CLAVIS_STORAGE_ACCOUNT=$storage_account"
            echo "CLAVIS_DEPLOY_CONTAINER=$deploy_container"
            echo "CLAVIS_DEPLOY_PREFIX=$deploy_prefix"
            echo "CLAVIS_ATTACHMENTS_CONTAINER=$attachments_container"
            echo "CLAVIS_STORAGE_CONNECTION_STRING=$connection_string"
          } >> "$GITHUB_ENV"

      # `outputs.imageid` from the build is a LOCAL config id and is not
      # pullable. Resolving the tag here gives the registry digest, which is.
      - name: Resolve image digests
        run: |
          repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          for image in api app auth; do
            ref="ghcr.io/${repo}/${image}:sha-${DEPLOY_SHA}"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{ .Manifest.Digest }}')
            [ -n "$digest" ] || { echo "no digest for $ref"; exit 1; }
            echo "resolved ${image} -> ${digest}"
            var=$(echo "$image" | tr '[:lower:]' '[:upper:]')
            echo "CLAVIS_${var}_IMAGE=ghcr.io/${repo}/${image}@${digest}" >> "$GITHUB_ENV"
          done

      - name: Build the bundle
        env:
          CLAVIS_DATABASE_URL: ${{ secrets.CLAVIS_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          KC_BOOTSTRAP_ADMIN_USERNAME: ${{ secrets.KC_BOOTSTRAP_ADMIN_USERNAME }}
          KC_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}
          KEYCLOAK_API_CLIENT_SECRET: ${{ secrets.KEYCLOAK_API_CLIENT_SECRET }}
          ROOT_EMAIL: ${{ secrets.ROOT_EMAIL }}
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          KEYCLOAK_SMTP_FROM: ${{ vars.KEYCLOAK_SMTP_FROM }}
          CLAVIS_ADMIN_ALLOWLIST_RAW: ${{ vars.ADMIN_ALLOWED_CIDRS }}
        run: bash scripts/build-deploy-bundle.sh

      - name: Publish to blob storage
        run: |
          base="${CLAVIS_DEPLOY_PREFIX}"
          az storage blob upload --auth-mode login --overwrite \
            --account-name "$CLAVIS_STORAGE_ACCOUNT" --container-name "$CLAVIS_DEPLOY_CONTAINER" \
            --name "${base}/bundles/${DEPLOY_SHA}.tar.gz" --file dist/bundle.tar.gz -o none
          # current.json LAST: until it points at the new bundle, nothing on the
          # host changes, so a failed upload above leaves the running stack alone.
          az storage blob upload --auth-mode login --overwrite \
            --account-name "$CLAVIS_STORAGE_ACCOUNT" --container-name "$CLAVIS_DEPLOY_CONTAINER" \
            --name "${base}/current.json" --file dist/current.json -o none
          echo "published ${DEPLOY_SHA}"

      - name: Wait for the host to converge
        run: bash scripts/wait-for-deploy.sh

      - name: Smoke test
        env:
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
        run: bash scripts/smoke-production.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${DEPLOY_SHA}\` |"
            echo "| App | https://${CLAVIS_APP_FQDN} |"
            echo "| API | https://${CLAVIS_API_FQDN} |"
            echo "| Auth | https://${CLAVIS_AUTH_FQDN} |"
            echo "| Certificate | \`${CLAVIS_CERT_RESOLVER}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
