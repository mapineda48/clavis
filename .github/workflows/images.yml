# Builds the three production images and publishes them to GHCR.
#
# The deployment consumes DIGESTS, never tags: `latest` is published only so a
# human can pull something by hand. Each matrix leg writes its digest to its own
# artifact, and a collector job assembles them into a single digests.json.
#
# Why per-leg artifacts instead of job outputs: every leg of a matrix writes to
# the SAME `jobs.<id>.outputs` map, so the last one to finish wins and the other
# two digests are silently lost — which would deploy two stale images while
# reporting success.

name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: packages/api/Dockerfile
          - name: app
            dockerfile: packages/app/Dockerfile
          # Published as `auth` to match the public surface (app/api/auth);
          # what it runs is Keycloak, built from infra/keycloak.
          - name: auth
            dockerfile: infra/keycloak/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An OCI reference must be lowercase, and `github.repository` only happens
      # to be so today. metadata-action lowercases it either way; a hand-written
      # `docker build -t ghcr.io/${{ github.repository }}/...` would fail at push
      # time and nowhere earlier the day the repository is renamed.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # The context is the repository root for all three: the API and SPA
          # Dockerfiles need the workspace manifests and the lockfile, and the
          # Keycloak one needs infra/keycloak/themes.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this, Buildx turns a single-platform push into an OCI index
          # carrying an extra `unknown/unknown` attestation manifest.
          provenance: false
          # Per-image cache scope. Sharing the default `buildkit` scope across
          # three images makes each one evict the others' layers, and the cache
          # hit rate collapses to about zero.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # `outputs.digest` is the registry digest. `outputs.imageid` is the LOCAL
      # image config id and is not pullable: deploying by it yields
      # `manifest unknown`.
      - name: Record the digest
        run: |
          test -n "${{ steps.build.outputs.digest }}" || { echo "empty digest"; exit 1; }
          mkdir -p digests
          printf '%s' '${{ steps.build.outputs.digest }}' > "digests/${{ matrix.name }}"

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error

  collect:
    name: Collect digests
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download every digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Assemble digests.json
        run: |
          repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          for image in api app auth; do
            test -s "digests/$image" || { echo "missing digest for $image"; exit 1; }
          done
          jq -n \
            --arg commit '${{ github.sha }}' \
            --arg registry "ghcr.io/$repo" \
            --arg api "$(cat digests/api)" \
            --arg app "$(cat digests/app)" \
            --arg auth "$(cat digests/auth)" \
            '{
               commit: $commit,
               images: {
                 api:  "\($registry)/api@\($api)",
                 app:  "\($registry)/app@\($app)",
                 auth: "\($registry)/auth@\($auth)"
               }
             }' > digests.json
          cat digests.json

      - name: Upload digests.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests
          path: digests.json
          retention-days: 30
          if-no-files-found: error
