# Terraform: creates, inspects or tears down the droplet and its DNS records.
#
# Manual only. The stack is brought up on demand — typically for an interview —
# and destroyed afterwards, so there is nothing to trigger automatically.
#
# Authentication to Azure is federated: no client secret is stored anywhere. The
# repository was created after GitHub's 2026-07-15 cutover to immutable subject
# claims, so the app registration carries BOTH subject formats and whichever one
# GitHub actually sends is the one that matches.

name: Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: What Terraform should do
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]
      skip_acme_flush:
        description: Destroy immediately, without waiting out the ACME backup window
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-production
  cancel-in-progress: false

jobs:
  terraform:
    name: terraform ${{ inputs.action }}
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: infra/terraform

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      # ARM_USE_AZUREAD is not optional. Without it the azurerm backend tries to
      # fetch a storage account shared key, which a federated identity cannot
      # do, and init fails with an authorization error that reads like a missing
      # role assignment — sending you off to grant Contributor on the storage
      # account, which does not help.
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_region: ${{ vars.DROPLET_REGION }}
      TF_VAR_droplet_size: ${{ vars.DROPLET_SIZE }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      # Optional access lists arrive as comma-separated strings and become HCL
      # lists. Both default to closed when the variable is unset.
      - name: Build the access lists
        run: |
          to_hcl() {
            [ -z "$1" ] && { echo '[]'; return; }
            echo "$1" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))'
          }
          {
            echo "TF_VAR_ssh_allowed_cidrs=$(to_hcl '${{ vars.SSH_ALLOWED_CIDRS }}')"
            admin=$(to_hcl '${{ vars.ADMIN_ALLOWED_CIDRS }}')
            [ "$admin" = "[]" ] && admin='["127.0.0.1/32"]'
            echo "TF_VAR_admin_allowed_cidrs=$admin"
          } >> "$GITHUB_ENV"

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # `plan` never authenticates a CREATE, so a token that cannot write shows
      # up halfway through `apply` — after the droplet already exists — as a
      # bare "401 Unauthorized". Failing here instead, with a message that names
      # the likely cause, is worth the two seconds.
      # A real write, deliberately, not /user/tokens/verify.
      #
      # Verified the hard way: `verify` returns success even from a source the
      # token's Client IP Address Filtering condition rejects, so it is worth
      # nothing as a preflight. Only an actual write proves the token can do the
      # thing the apply is about to ask of it.
      - name: Preflight the Cloudflare token
        env:
          ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          zone="${ZONE_ID:-$(curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=${{ vars.CLOUDFLARE_ZONE_NAME || 'mapineda48.com' }}" \
            | jq -r '.result[0].id // empty')}"
          [ -n "$zone" ] || { echo "::error::Could not even read the zone with this token."; exit 1; }
          resp=$(curl -s -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"type":"TXT","name":"_terraform-preflight","content":"preflight","ttl":60}' \
            "https://api.cloudflare.com/client/v4/zones/${zone}/dns_records")
          id=$(echo "$resp" | jq -r '.result.id // empty')
          if [ -z "$id" ]; then
            echo "$resp" | jq -c '{success, errors: [.errors[]?.message]}'
            echo "::error::The Cloudflare token cannot write to the zone from this runner. If it works from your own machine, it has Client IP Address Filtering set — GitHub-hosted runners have no stable address, so the filter has to go or a separate unfiltered token is needed."
            exit 1
          fi
          curl -s -X DELETE -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${zone}/dns_records/${id}" -o /dev/null
          echo "The token can create and delete records in the zone."

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -lockfile=readonly

      - name: Validate
        run: terraform validate

      - name: Plan
        if: inputs.action != 'destroy'
        run: terraform plan -out=tfplan

      - name: Apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      # The droplet is about to disappear, and with it anything Traefik issued
      # in the last few minutes. Nothing can reach the host to ask for a backup
      # — no SSH by design — so time is the only lever: the backup timer fires
      # every 10 minutes (AccuracySec=30s, so a tick lands within ~630s plus
      # the run itself), and waiting 12 minutes from now means one tick happens
      # before the droplet dies. What that tick then achieves cannot be
      # observed from here — if the blob mount is dead the backup fails and the
      # wait buys nothing; the path unit publishing on rewrite is the primary
      # mechanism and this window only covers its coalesced-inotify gap. Let's
      # Encrypt grants five certificates per week for the same names; twelve
      # minutes of droplet-hours is the cheap side of that trade.
      # `skip_acme_flush` is the escape hatch when nothing was issued recently.
      #
      # `output -json`, not `-raw … || true`: an empty state (no droplet,
      # nothing to wait for) must not look like an unreadable one. A transient
      # storage error would silently skip the wait, and the destroy right after
      # can succeed on its own retry — the one path where "the destroy would
      # fail first anyway" is false.
      - name: Wait out the ACME backup window before tearing down
        if: inputs.action == 'destroy' && !inputs.skip_acme_flush
        run: |
          outputs=$(terraform output -json)
          ip=$(printf '%s' "$outputs" | jq -r '.droplet_ipv4.value // empty')
          if [ -z "$ip" ]; then echo "no droplet in state, nothing to wait for"; exit 0; fi
          echo "Droplet ${ip} exists: waiting 12 minutes so the 10-minute backup timer gets one tick."
          sleep 720

      - name: Destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Summary
        if: inputs.action == 'apply'
        run: |
          {
            echo "### Infrastructure"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Droplet | \`$(terraform output -raw droplet_ipv4)\` |"
            echo "| App | $(terraform output -raw app_url) |"
            echo "| Auth | $(terraform output -raw auth_url) |"
            echo
            echo "The host converges on whatever \`deploy\` last published; it polls every 60 s."
          } >> "$GITHUB_STEP_SUMMARY"
