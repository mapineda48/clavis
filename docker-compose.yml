# Stack de infraestructura del ERP de demostracion.
#
# Todas las variables se leen del .env de la raiz del monorepo mediante la
# interpolacion de docker compose. Cada referencia lleva un valor por defecto
# para que el stack arranque incluso con un .env minimo o ausente.
#
# Las variables derivadas (DATABASE_URL, VALKEY_URL, KEYCLOAK_ISSUER,
# KEYCLOAK_INTERNAL_ISSUER, KEYCLOAK_AUDIENCE y CORS_ORIGINS) NO viven en el
# .env: se componen aqui, tal y como exige el contrato.
#
# Perfiles:
#   (por defecto)  postgres, keycloak-realm, keycloak, valkey, azurite, api
#   full           ademas el SPA servido por nginx en el puerto 8081

name: ${COMPOSE_PROJECT_NAME:-erp-demo}

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL: base de datos del ERP y (via script de init) la de Keycloak.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17.6-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-erp-demo}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      # Consumidas por infra/postgres/00-init-databases.sh
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Los scripts de /docker-entrypoint-initdb.d solo corren la primera vez,
      # cuando el volumen pg-data esta vacio.
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - erp-net

  # ---------------------------------------------------------------------------
  # Renderizador del realm (one-shot). Sustituye los marcadores __VAR__ de
  # realm-erp.template.json y deja realm-erp.json en el volumen keycloak-import.
  # ---------------------------------------------------------------------------
  keycloak-realm:
    image: node:22.23.1-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-erp-demo}-keycloak-realm
    restart: "no"
    working_dir: /work
    command: ["node", "/work/render-realm.mjs"]
    environment:
      OUTPUT_DIR: /import
      # --- identidad del realm
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-erp}
      KEYCLOAK_APP_CLIENT_ID: ${KEYCLOAK_APP_CLIENT_ID:-erp-app}
      KEYCLOAK_API_CLIENT_ID: ${KEYCLOAK_API_CLIENT_ID:-erp-api}
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET:-erp_api_dev_secret}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      # --- URLs del SPA (redirect URIs y web origins)
      APP_DEV_URL: ${APP_DEV_URL:-http://localhost:5173}
      APP_PROD_URL: ${APP_PROD_URL:-http://localhost:8081}
      # --- usuarios demo
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-admin}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@erp.local}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin123!}
      DEMO_MANAGER_USERNAME: ${DEMO_MANAGER_USERNAME:-manager}
      DEMO_MANAGER_EMAIL: ${DEMO_MANAGER_EMAIL:-manager@erp.local}
      DEMO_MANAGER_PASSWORD: ${DEMO_MANAGER_PASSWORD:-Manager123!}
      DEMO_USER_USERNAME: ${DEMO_USER_USERNAME:-worker}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-worker@erp.local}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Worker123!}
    volumes:
      - ./infra/keycloak:/work:ro
      - keycloak-import:/import
    networks:
      - erp-net

  # ---------------------------------------------------------------------------
  # Keycloak 26 en modo desarrollo, con import automatico del realm.
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: ${COMPOSE_PROJECT_NAME:-erp-demo}-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-realm:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin_dev_password}
      KC_HTTP_ENABLED: "true"
      # URL publica: debe coincidir con el issuer que valida la API.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak-import:/opt/keycloak/data/import
    healthcheck:
      # La imagen no trae curl ni wget: hablamos HTTP a pelo con /dev/tcp de bash
      # contra el puerto de management (9000) y buscamos el estado UP.
      test:
        - CMD
        - bash
        - "-c"
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "UP" <&3'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - erp-net

  # ---------------------------------------------------------------------------
  # Valkey: cache de listados de todos.
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8.1.3-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-erp-demo}-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--dir", "/data"]
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - erp-net

  # ---------------------------------------------------------------------------
  # Azurite: emulador de Azure Storage para los adjuntos.
  # ---------------------------------------------------------------------------
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: ${COMPOSE_PROJECT_NAME:-erp-demo}-azurite
    restart: unless-stopped
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --location
      - /data
      # El SDK @azure/storage-blob 12.33 negocia una version de API mas reciente
      # que la que conoce Azurite 3.35 y el emulador la rechaza con
      # InvalidHeaderValue. Esta bandera desactiva esa comprobacion; es el
      # workaround oficial para el emulador y no afecta a Azure real.
      - --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    healthcheck:
      # Azurite responde 400/403 a una peticion anonima: con que conteste algo
      # por debajo de 500 ya sabemos que el endpoint blob esta escuchando.
      test:
        - CMD
        - node
        - "-e"
        - "require('http').get('http://127.0.0.1:10000/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - erp-net

  # ---------------------------------------------------------------------------
  # API Fastify. El contexto de build es la RAIZ del repo (monorepo pnpm).
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-erp-demo}-api
    container_name: ${COMPOSE_PROJECT_NAME:-erp-demo}-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      azurite:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Dentro del contenedor el puerto es siempre 3000; API_PORT solo cambia el
      # puerto publicado en el host.
      API_PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      # --- variables derivadas (seccion 6 del contrato)
      DATABASE_URL: "postgres://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-erp_dev_password}@postgres:5432/${POSTGRES_DB:-erp}"
      VALKEY_URL: "redis://valkey:6379"
      KEYCLOAK_ISSUER: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/${KEYCLOAK_REALM:-erp}"
      KEYCLOAK_INTERNAL_ISSUER: "http://keycloak:8080/realms/${KEYCLOAK_REALM:-erp}"
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_API_CLIENT_ID:-erp-api}
      CORS_ORIGINS: "${APP_DEV_URL:-http://localhost:5173},${APP_PROD_URL:-http://localhost:8081}"
      # --- almacenamiento
      AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;}"
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-erp-attachments}
      # --- correo
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: "${MAIL_FROM:-ERP Demo <onboarding@resend.dev>}"
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - erp-net

  # ---------------------------------------------------------------------------
  # SPA servido por nginx. Solo con el perfil `full`.
  # La configuracion llega en runtime: 40-erp-runtime-config.sh convierte estas
  # variables ERP_* en window.__ERP_CONFIG__ dentro de /config.js.
  # ---------------------------------------------------------------------------
  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: packages/app/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-erp-demo}-app
    container_name: ${COMPOSE_PROJECT_NAME:-erp-demo}-app
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ERP_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      ERP_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-erp}
      ERP_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_APP_CLIENT_ID:-erp-app}
      ERP_KEYCLOAK_API_CLIENT_ID: ${KEYCLOAK_API_CLIENT_ID:-erp-api}
      ERP_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "8081:80"
    networks:
      - erp-net

networks:
  erp-net:
    driver: bridge

volumes:
  pg-data:
  valkey-data:
  azurite-data:
  keycloak-import:
