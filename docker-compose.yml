# Infrastructure stack for the Clavis demo.
#
# Every variable is read from the .env at the monorepo root through docker
# compose interpolation. Each reference carries a default so the stack still
# boots with a minimal .env, or with none at all.
#
# The derived variables (DATABASE_URL, VALKEY_URL, KEYCLOAK_ISSUER,
# KEYCLOAK_INTERNAL_ISSUER, KEYCLOAK_AUDIENCE and CORS_ORIGINS) do NOT live in
# the .env: they are composed here, exactly as the contract requires.
#
# Profiles:
#   (default)  postgres, keycloak-realm, keycloak, valkey, azurite, api
#   full       adds the SPA served by nginx on port 8081

name: ${COMPOSE_PROJECT_NAME:-clavis}

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL: Clavis database and — via the init script — Keycloak's.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17.6-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-clavis}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clavis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clavis_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-clavis}
      # Consumed by infra/postgres/00-init-databases.sh
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Scripts under /docker-entrypoint-initdb.d only run the first time,
      # while the pg-data volume is still empty.
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-clavis} -d ${POSTGRES_DB:-clavis}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - clavis-net

  # ---------------------------------------------------------------------------
  # Realm renderer (one-shot). Replaces the __VAR__ markers in
  # realm-clavis.template.json and drops realm-clavis.json into the keycloak-import
  # volume.
  # ---------------------------------------------------------------------------
  keycloak-realm:
    image: node:22.23.1-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-clavis}-keycloak-realm
    restart: "no"
    working_dir: /work
    command: ["node", "/work/render-realm.mjs"]
    environment:
      OUTPUT_DIR: /import
      # --- realm identity
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-clavis}
      KEYCLOAK_APP_CLIENT_ID: ${KEYCLOAK_APP_CLIENT_ID:-clavis-app}
      KEYCLOAK_API_CLIENT_ID: ${KEYCLOAK_API_CLIENT_ID:-clavis-api}
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET:-clavis_api_dev_secret}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      # --- login screen theme
      # Fills the __KEYCLOAK_LOGIN_THEME__ marker in the realm template.
      # `clavis` is the custom theme in ./infra/keycloak/themes/clavis; `keycloak`
      # falls back to the one shipped with the server.
      KEYCLOAK_LOGIN_THEME: ${KEYCLOAK_LOGIN_THEME:-clavis}
      # --- theme for the emails Keycloak sends (password reset, etc.)
      KEYCLOAK_EMAIL_THEME: ${KEYCLOAK_EMAIL_THEME:-clavis}
      # --- realm SMTP: used by KEYCLOAK, not by the API.
      # The API sends through the Resend HTTP API; Keycloak only speaks SMTP,
      # so it points at the Resend SMTP relay with the SAME key.
      # Every value has a default: rendering fails if a marker is left empty,
      # and that would stop the stack for anyone who does not care about email.
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:-smtp.resend.com}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:-587}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM:-onboarding@resend.dev}
      KEYCLOAK_SMTP_FROM_DISPLAY_NAME: ${KEYCLOAK_SMTP_FROM_DISPLAY_NAME:-Clavis}
      KEYCLOAK_SMTP_SSL: ${KEYCLOAK_SMTP_SSL:-false}
      KEYCLOAK_SMTP_STARTTLS: ${KEYCLOAK_SMTP_STARTTLS:-true}
      KEYCLOAK_SMTP_AUTH: ${KEYCLOAK_SMTP_AUTH:-true}
      KEYCLOAK_SMTP_USER: ${KEYCLOAK_SMTP_USER:-resend}
      # RESEND_API_KEY is reused so there is only one secret to maintain.
      KEYCLOAK_SMTP_PASSWORD: ${RESEND_API_KEY:-not-configured}
      # --- SPA URLs (redirect URIs and web origins)
      APP_DEV_URL: ${APP_DEV_URL:-http://localhost:5173}
      APP_PROD_URL: ${APP_PROD_URL:-http://localhost:8081}
      # --- demo users
    volumes:
      - ./infra/keycloak:/work:ro
      - keycloak-import:/import
    networks:
      - clavis-net

  # ---------------------------------------------------------------------------
  # Keycloak 26 in development mode, importing the realm on boot.
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: ${COMPOSE_PROJECT_NAME:-clavis}-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-realm:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin_dev_password}
      KC_HTTP_ENABLED: "true"
      # Public URL: must match the issuer the API validates against.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak-import:/opt/keycloak/data/import
      # Custom login theme (`clavis`), mounted read-only.
      # Mounting over /opt/keycloak/themes is safe: in the official image that
      # directory only holds a README. The built-in themes (base, keycloak,
      # keycloak.v2) are NOT there — they ship inside the server JARs — so this
      # mount hides nothing and `parent=base` still resolves.
      # With `start-dev` themes are not cached: edit a .ftl or the CSS, reload
      # the browser and you are done (see README and docs/operations.md).
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # The image ships neither curl nor wget: we speak raw HTTP through bash's
      # /dev/tcp against the management port (9000) and look for the UP status.
      test:
        - CMD
        - bash
        - "-c"
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "UP" <&3'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - clavis-net

  # ---------------------------------------------------------------------------
  # Valkey: cache for the todo listings.
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8.1.3-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-clavis}-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--dir", "/data"]
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - clavis-net

  # ---------------------------------------------------------------------------
  # Azurite: Azure Storage emulator backing the attachments.
  # ---------------------------------------------------------------------------
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: ${COMPOSE_PROJECT_NAME:-clavis}-azurite
    restart: unless-stopped
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
      - --location
      - /data
      # The @azure/storage-blob 12.33 SDK negotiates a newer API version than
      # Azurite 3.35 knows about, and the emulator rejects it with
      # InvalidHeaderValue. This flag turns that check off; it is the official
      # workaround for the emulator and has no effect on real Azure.
      - --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    healthcheck:
      # Azurite answers 400/403 to an anonymous request: anything below 500 is
      # enough to know the blob endpoint is listening.
      test:
        - CMD
        - node
        - "-e"
        - "require('http').get('http://127.0.0.1:10000/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - clavis-net

  # ---------------------------------------------------------------------------
  # Express API. The build context is the ROOT of the repo (pnpm monorepo).
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-clavis}-api
    container_name: ${COMPOSE_PROJECT_NAME:-clavis}-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      azurite:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Inside the container the port is always 3000; API_PORT only changes the
      # port published on the host.
      API_PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-10000}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      # --- derived variables (contract, section 6)
      DATABASE_URL: "postgres://${POSTGRES_USER:-clavis}:${POSTGRES_PASSWORD:-clavis_dev_password}@postgres:5432/${POSTGRES_DB:-clavis}"
      VALKEY_URL: "redis://valkey:6379"
      KEYCLOAK_ISSUER: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/${KEYCLOAK_REALM:-clavis}"
      KEYCLOAK_INTERNAL_ISSUER: "http://keycloak:8080/realms/${KEYCLOAK_REALM:-clavis}"
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_API_CLIENT_ID:-clavis-api}
      # The service account of this client manages realm users (Admin REST).
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET:-clavis_api_dev_secret}
      KEYCLOAK_APP_CLIENT_ID: ${KEYCLOAK_APP_CLIENT_ID:-clavis-app}
      CORS_ORIGINS: "${APP_DEV_URL:-http://localhost:5173},${APP_PROD_URL:-http://localhost:8081}"
      # --- root user, seeded by the API at boot
      ROOT_USERNAME: ${ROOT_USERNAME:-root}
      ROOT_EMAIL: ${ROOT_EMAIL:-root@clavis.local}
      ROOT_PASSWORD: ${ROOT_PASSWORD:-Root123!}
      ROOT_DISPLAY_NAME: ${ROOT_DISPLAY_NAME:-Root}
      # Where Keycloak action emails send the user back to.
      PUBLIC_APP_URL: ${APP_DEV_URL:-http://localhost:5173}
      # --- storage
      AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;}"
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-clavis-attachments}
      # --- email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: "${MAIL_FROM:-Clavis <onboarding@resend.dev>}"
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - clavis-net

  # ---------------------------------------------------------------------------
  # SPA served by nginx. Only under the `full` profile.
  # Configuration arrives at runtime: 40-clavis-runtime-config.sh turns these CLAVIS_*
  # variables into window.__CLAVIS_CONFIG__ inside /config.js.
  # ---------------------------------------------------------------------------
  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: packages/app/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-clavis}-app
    container_name: ${COMPOSE_PROJECT_NAME:-clavis}-app
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      CLAVIS_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      CLAVIS_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-clavis}
      CLAVIS_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_APP_CLIENT_ID:-clavis-app}
      CLAVIS_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "8081:80"
    networks:
      - clavis-net

networks:
  clavis-net:
    driver: bridge

volumes:
  pg-data:
  valkey-data:
  azurite-data:
  keycloak-import:
