# Production stack. Shipped inside the deploy bundle and run from /opt/erp/stack.
#
# Differences from the development compose that matter:
#
#   * Postgres and Azurite are gone. The database is Neon over TLS and the
#     attachments live in the real storage account, so the `azurite` service AND
#     its entry in api.depends_on both had to go — leaving the dependency behind
#     makes the API wait forever for a service that no longer exists.
#   * Traefik is the ONLY service publishing a port. Nothing else is reachable
#     from outside the compose network.
#   * Images are pinned by digest through the required `${VAR:?}` form. Plain
#     ${VAR} substitutes an empty string with nothing but a warning, and
#     `image: ""` fails later with an error that points nowhere useful.

name: erp

networks:
  erp-net:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Edge. Terminates TLS for both hostnames with a single certificate.
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.7.10
    container_name: erp-traefik
    restart: unless-stopped
    ports:
      # 80 is not only the HTTPS redirect: it is also where the ACME HTTP-01
      # challenge is answered, which is why this host needs no Cloudflare
      # credential at all.
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      # A single-FILE bind mount, and on local ext4 rather than the blob mount.
      # Safe because Traefik rewrites acme.json in place (O_TRUNC) instead of
      # replacing the inode; a writer that renamed would orphan this mount.
      - /var/lib/traefik/acme.json:/acme.json
    # No Docker socket anywhere: routing comes from the file provider, so a
    # container that manages to start on this host cannot mint itself a route
    # and take over the Keycloak hostname with a label.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [erp-net]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # SPA. Its Keycloak and API URLs are injected at boot, so the same image runs
  # unchanged in development and here.
  # ---------------------------------------------------------------------------
  app:
    image: ${ERP_APP_IMAGE:?the SPA image digest is required}
    container_name: erp-app
    restart: unless-stopped
    environment:
      ERP_KEYCLOAK_URL: https://${ERP_AUTH_FQDN:?}
      ERP_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-erp}
      ERP_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_APP_CLIENT_ID:-erp-app}
      ERP_KEYCLOAK_API_CLIENT_ID: ${KEYCLOAK_API_CLIENT_ID:-erp-api}
      # Same origin as the SPA: no preflight on any call the app makes.
      ERP_API_URL: https://${ERP_APP_FQDN:?}/api
    read_only: true
    tmpfs:
      - /run
      - /var/cache/nginx
    cap_drop: [ALL]
    # nginx's master runs as root and drops its workers to the nginx user, so it
    # needs exactly these four and nothing more.
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [erp-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # API.
  # ---------------------------------------------------------------------------
  api:
    image: ${ERP_API_IMAGE:?the API image digest is required}
    container_name: erp-api
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      DATABASE_URL: ${ERP_DATABASE_URL:?the Neon connection string is required}
      VALKEY_URL: redis://valkey:6379
      # Public issuer: what the token carries and what is validated.
      KEYCLOAK_ISSUER: https://${ERP_AUTH_FQDN:?}/realms/${KEYCLOAK_REALM:-erp}
      # Internal issuer: where JWKS is fetched, over the compose network.
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/${KEYCLOAK_REALM:-erp}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_API_CLIENT_ID:-erp-api}
      CORS_ORIGINS: https://${ERP_APP_FQDN:?}
      AZURE_STORAGE_CONNECTION_STRING: ${ERP_STORAGE_CONNECTION_STRING:?}
      AZURE_STORAGE_CONTAINER: ${ERP_ATTACHMENTS_CONTAINER:-erp-attachments}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-ERP Demo <onboarding@resend.dev>}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [erp-net]
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # Keycloak.
  # ---------------------------------------------------------------------------
  keycloak:
    image: ${ERP_KEYCLOAK_IMAGE:?the Keycloak image digest is required}
    container_name: erp-keycloak
    restart: unless-stopped
    command: ["start", "--optimized"]
    environment:
      # Only sslmode: pgjdbc tolerates Neon's channel_binding parameter but does
      # not implement it, and carrying a flag the driver ignores reads as a
      # guarantee that is not there.
      KC_DB_URL: jdbc:postgresql://${ERP_DB_HOST:?}/${ERP_KC_DB_NAME:-keycloak}?sslmode=require
      KC_DB_USERNAME: ${ERP_DB_USER:?}
      KC_DB_PASSWORD: ${ERP_DB_PASSWORD:?}
      # Neon suspends an idle compute after five minutes and drops the
      # connections with it. Keycloak has no supported connection-validation
      # option, so never holding an idle one is the only supported equivalent.
      KC_DB_POOL_INITIAL_SIZE: "0"
      KC_DB_POOL_MIN_SIZE: "0"
      KC_DB_POOL_MAX_SIZE: "10"
      KC_DB_CONNECT_TIMEOUT: "15"
      # Absolute public URL. KC_HOSTNAME_STRICT is deliberately absent: it is
      # ignored whenever KC_HOSTNAME is set, so setting it reads like a control
      # that does nothing.
      KC_HOSTNAME: https://${ERP_AUTH_FQDN:?}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_HOST: 0.0.0.0
      KC_PROXY_HEADERS: xforwarded
      # Single node on a disposable host: no JGroups discovery, no cluster.
      KC_CACHE: local
      # Honoured only on the boot that creates the master realm.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?}
      # KC_HEALTH_ENABLED and KC_METRICS_ENABLED are baked into the image. A
      # runtime value that differs from the baked one aborts startup.
    # read_only is NOT set: Quarkus re-augmentation writes under
    # /opt/keycloak/lib/quarkus and data/tmp even with --optimized, and the
    # server refuses to start without them.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [erp-net]
    healthcheck:
      # Health lives on the management port, and the image ships neither curl
      # nor wget.
      test:
        - CMD
        - bash
        - "-c"
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "UP" <&3'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---------------------------------------------------------------------------
  # Realm convergence. Run by reconcile.sh BEFORE the stack comes up, never as
  # part of `up`.
  #
  # `start --import-realm` is hard-wired to IGNORE_EXISTING, so against a
  # persistent database it imports once and silently skips every time after.
  # With a disposable host and a permanent database that means the realm freezes
  # at whatever the very first boot produced while every later deploy reports
  # success. `import --override` is what actually converges.
  #
  # The cost, stated plainly: realm state created at runtime — users who signed
  # up, passwords changed through the account console — is discarded on every
  # deploy. For a demo whose users are fixtures that is the right trade.
  # ---------------------------------------------------------------------------
  keycloak-import:
    profiles: ["import"]
    image: ${ERP_KEYCLOAK_IMAGE:?}
    container_name: erp-keycloak-import
    restart: "no"
    command: ["import", "--file", "/import/realm-erp.json", "--override", "true"]
    environment:
      KC_DB_URL: jdbc:postgresql://${ERP_DB_HOST:?}/${ERP_KC_DB_NAME:-keycloak}?sslmode=require
      KC_DB_USERNAME: ${ERP_DB_USER:?}
      KC_DB_PASSWORD: ${ERP_DB_PASSWORD:?}
      KC_HOSTNAME: https://${ERP_AUTH_FQDN:?}
      KC_HTTP_ENABLED: "true"
      KC_CACHE: local
    volumes:
      - ./realm:/import:ro
    networks: [erp-net]

  # ---------------------------------------------------------------------------
  # Cache. Genuinely disposable: no persistence, no volume.
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8.1.3-alpine
    container_name: erp-valkey
    restart: unless-stopped
    # The development stack keeps an append-only file; here the cache holds
    # nothing worth surviving a restart, and the API invalidates by namespace
    # version anyway.
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    read_only: true
    tmpfs:
      - /data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [erp-net]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
