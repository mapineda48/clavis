# fail2ban for SSH.
#
# Two details that make the difference between a working jail and one that
# reports `enabled` while never banning anybody:
#
#   * backend = systemd. Ubuntu has no /var/log/auth.log without rsyslog, and
#     the stock Debian jail tails exactly that file.
#
#   * journalmatch on _COMM. Upstream matches _SYSTEMD_UNIT=sshd.service, but
#     Ubuntu's unit is ssh.service and socket activation names each instance
#     ssh@<n>-<addr>:22-…, so a unit match finds nothing.
#
# The chain stays INPUT (the default): SSH really does arrive there. It must NOT
# be moved to DOCKER-USER globally — that is only correct for jails watching
# traffic served by containers.

[sshd]
enabled  = true
backend  = systemd
journalmatch = _COMM=sshd
port     = ssh
maxretry = 4
findtime = 10m
bantime  = 1h
