# Named 00- on purpose. OpenSSH takes the FIRST value it sees for most
# directives and reads drop-ins in lexical order, and cloud-init ships
# 50-cloud-init.conf: a 99- file would lose every conflict silently.

# DigitalOcean injects the registered key into root's authorized_keys and
# nowhere else, so root stays reachable by key for break-glass. Creating a
# separate user and setting AllowUsers in the same breath is the classic way to
# end up with a droplet nobody can log into.
PermitRootLogin prohibit-password

PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitEmptyPasswords no
UsePAM yes

MaxAuthTries 3
MaxSessions 4
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2

X11Forwarding no
AllowAgentForwarding no
PermitUserEnvironment no

# TCP forwarding stays ON: with 5432, 6379 and the Keycloak admin port no longer
# published, `ssh -L` is the only way in for an operator, and the firewall keeps
# port 22 shut unless someone opens it deliberately.
AllowTcpForwarding yes
