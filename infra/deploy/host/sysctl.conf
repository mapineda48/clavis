# Host tuning.
#
# Deliberately absent: net.ipv4.ip_forward and
# net.bridge.bridge-nf-call-iptables. Setting either to 0 — as CIS-style
# templates do — kills all container networking the next time anything runs
# `sysctl --system`, which in practice is during unattended-upgrades, hours
# after the deploy passed its smoke test. Docker manages both.

# Valkey checks this at startup and warns that a background save may fail under
# memory pressure. It is not namespaced, so a compose `sysctls:` entry cannot
# set it.
vm.overcommit_memory = 1

# Traefik fronts every connection; the default backlog is small for a host that
# terminates TLS for the whole stack.
net.core.somaxconn = 1024
net.ipv4.tcp_max_syn_backlog = 2048

# Basic anti-spoofing and no source routing.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.tcp_syncookies = 1

kernel.dmesg_restrict = 1
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
