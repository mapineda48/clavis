// Security updates only.
//
// The `#clear` is what makes that true. APT configuration lists APPEND across
// the files in /etc/apt/apt.conf.d, so declaring a shorter Allowed-Origins here
// without clearing first leaves the default "${distro_id}:${distro_codename}"
// in place — the whole release pocket, not just security — and the policy is
// silently a full-release auto-upgrade.

#clear Unattended-Upgrade::Allowed-Origins;
Unattended-Upgrade::Allowed-Origins {
    "${distro_id}:${distro_codename}-security";
    "${distro_id}ESMApps:${distro_codename}-apps-security";
    "${distro_id}ESM:${distro_codename}-infra-security";
};

APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";

Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-Unused-Dependencies "true";

// Never reboot underneath a live demo. The droplet is short-lived and rebuilt
// from scratch, so a pending kernel update is resolved by the next apply rather
// than by a surprise restart.
Unattended-Upgrade::Automatic-Reboot "false";
