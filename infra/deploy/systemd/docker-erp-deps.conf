# Drop-in for docker.service.
#
# Docker must not start until the blob mount is up AND the ACME state has been
# restored to local disk. If Traefik starts without acme.json it registers a
# brand-new ACME account and orders fresh certificates; do that six times in a
# week for the same names and Let's Encrypt locks the hostname out.
#
# Requires= rather than Wants= on purpose: a stack running without persisted
# certificates looks healthy and quietly burns the weekly quota, which is worse
# than not starting.

[Unit]
After=erp-blobfuse2.service erp-acme-restore.service
Requires=erp-blobfuse2.service erp-acme-restore.service
