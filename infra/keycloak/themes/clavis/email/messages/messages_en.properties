# English texts for the Clavis demo email theme.
#
# This is the reference catalogue: add a key here first, then mirror it in
# messages_es.properties. The two must always hold the same set of keys.
#
# Plain ASCII, like every bundle here: Keycloak reads message bundles as
# ISO-8859-1 unless told otherwise, so any non-ASCII character would have to be
# written as a unicode escape. English needs none.
#
# Keys prefixed with `clavis` belong to this theme and are used by our templates.
# Everything not declared here is inherited from the `base` theme, including the
# `linkExpirationFormatter.timePeriodUnit.*` keys that word the expiration.
#
# Every message goes through MessageFormat (even the ones without parameters),
# where a single quote is an escape character. That is why there is not a single
# apostrophe in this file: contractions are spelled out instead.

# --- Shared email layout ----------------------------------------------------
clavisEmailBrandBadge=CLV
clavisEmailBrandName=Clavis
clavisEmailBrandTagline=Access managed by Keycloak
clavisEmailGreeting=Hello,
clavisEmailGreetingNamed=Hello {0},
clavisEmailFooterDemo=Demo environment: data is reset whenever the containers are recreated.
clavisEmailFooterAuto=This is an automated message; there is no need to reply.

# --- Password recovery ------------------------------------------------------
# Subject line. Keycloak passes no parameters to it, hence no {0}.
passwordResetSubject=Reset your Clavis password
clavisResetPreheader=Link to choose a new Clavis password. It expires in a few minutes.
clavisResetTitle=Reset your password
# {0} = realm display name
clavisResetIntro=We received a request to change the password of your {0} account.
clavisResetCta=Click the button below to choose a new password.
clavisResetTextCta=Open this address in your browser to choose a new password:
clavisResetButton=Choose a new password
# {0} = expiration already worded by linkExpirationFormatter (e.g. 30 minutes)
clavisResetExpiry=For security reasons this link can only be used once and expires in {0}.
clavisResetIgnore=If this was not you, just ignore this message: your current password will keep working and nothing will change.
clavisResetFallback=If the button does not work, copy and paste this address into your browser:
