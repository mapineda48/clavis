# Spanish texts for the Clavis demo emails.
#
# messages_en.properties is the reference catalogue: this file mirrors it key by
# key, so anything added there has to be added here as well.
#
# Keycloak reads message bundles as ISO-8859-1, so this file is pure ASCII:
# accents and the enye are written as unicode escapes. That way the text reaches
# the inbox unchanged, whatever encoding the file is read with.
#
# Keys prefixed with `clavis` belong to this theme and are used by our templates.
# Anything not declared here is inherited from the `base` theme, including the
# `linkExpirationFormatter.timePeriodUnit.*` keys that word the expiration.
#
# Every message goes through MessageFormat (even the ones without parameters),
# where a single quote is an escape character: that is why not one is used in
# this file.

# --- Shared email layout ----------------------------------------------------
clavisEmailBrandBadge=CLV
clavisEmailBrandName=Clavis
clavisEmailBrandTagline=Acceso gestionado por Keycloak
clavisEmailGreeting=Hola:
clavisEmailGreetingNamed=Hola, {0}:
clavisEmailFooterDemo=Entorno de demostraci\u00f3n: los datos se reinician al recrear los contenedores.
clavisEmailFooterAuto=Este es un correo autom\u00e1tico; no hace falta que respondas.

# --- Password recovery ------------------------------------------------------
# Subject line. Keycloak passes no parameters to it, hence no {0}.
passwordResetSubject=Restablece tu contrase\u00f1a de Clavis
clavisResetPreheader=Enlace para elegir una contrase\u00f1a nueva en Clavis. Caduca en unos minutos.
clavisResetTitle=Restablece tu contrase\u00f1a
# {0} = realm display name
clavisResetIntro=Hemos recibido una solicitud para cambiar la contrase\u00f1a de tu cuenta de {0}.
clavisResetCta=Pulsa el bot\u00f3n para elegir una contrase\u00f1a nueva.
clavisResetTextCta=Abre esta direcci\u00f3n en tu navegador para elegir una contrase\u00f1a nueva:
clavisResetButton=Elegir una contrase\u00f1a nueva
# {0} = expiration already worded by linkExpirationFormatter (e.g. 30 minutos)
clavisResetExpiry=Por seguridad, este enlace solo se puede usar una vez y caduca en {0}.
clavisResetIgnore=Si no has sido t\u00fa, ignora este mensaje: tu contrase\u00f1a actual seguir\u00e1 siendo v\u00e1lida y no se cambiar\u00e1 nada.
clavisResetFallback=Si el bot\u00f3n no funciona, copia y pega esta direcci\u00f3n en tu navegador:
