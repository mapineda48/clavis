# English texts for the Clavis demo login theme.
#
# This is the reference catalogue: add a key here first, then mirror it in
# messages_es.properties. The two must always hold the same set of keys.
#
# Plain ASCII, like every bundle here: Keycloak reads message bundles as
# ISO-8859-1 unless told otherwise, so any non-ASCII character would have to be
# written as a unicode escape. English needs none.
#
# Keys prefixed with `clavis` belong to this theme. The rest override standard
# Keycloak messages so both languages read the same way.
#
# Messages with parameters ({0}) go through MessageFormat, where single quotes
# must be doubled. They are avoided here.

# --- Branding ---------------------------------------------------------------
clavisBrandTitle=Clavis
clavisBrandTagline=Keycloak governs access end to end: who signs in, with which role, and what they may do on each resource.
clavisPointRoles=Composite realm roles: clavis-user, clavis-manager and clavis-admin
clavisPointPermissions=Permissions per resource, not per screen
clavisPointTokens=JWT tokens verified on every API request

