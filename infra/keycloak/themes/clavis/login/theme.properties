# Login theme for the Clavis demo.
#
# We inherit from `base` (bare Freemarker templates, no PatternFly) and supply
# our own stylesheet. Importing `common/keycloak` is deliberately avoided: we do
# not use PatternFly, so there is no reason to drag in its CSS or its remote
# fonts.
#
# Anything we do not override (OTP, update password, verify email...) is still
# rendered by the `base` templates, but through OUR template.ftl and with the
# classes mapped below, so the whole flow looks the same.
parent=base

# Languages offered by the selector. Must match supportedLocales in the realm.
locales=en,es

# Local resources only, no CDNs. Served from ${url.resourcesPath}.
styles=css/clavis-login.css
scripts=js/clavis-login.js

# --- Mapping Keycloak class hooks onto the theme classes ---------------------
# These are the properties the templates inherited from `base` look up
# (`${properties.kcXxxClass!}`). Changing a value here means restarting the
# container: theme.properties is cached even though the .ftl files are not.

# Overall structure
kcHtmlClass=clavis-html
kcBodyClass=clavis-body
kcFormCardClass=clavis-card
kcFormHeaderClass=clavis-card__head
kcContentWrapperClass=clavis-card__body

# Forms
kcFormGroupClass=clavis-field
kcLabelClass=clavis-label
kcInputClass=clavis-input
kcInputGroup=clavis-input-group
kcInputErrorMessageClass=clavis-field-error
kcFormOptionsClass=clavis-options
kcFormOptionsWrapperClass=clavis-options
kcFormSettingClass=clavis-options
kcFormButtonsClass=clavis-field

# Buttons
kcButtonClass=clavis-btn
kcButtonPrimaryClass=clavis-btn--primary
kcButtonBlockClass=clavis-btn--block
kcButtonLargeClass=clavis-btn--lg
# Used WITHOUT kcButtonClass (e.g. in passkeys.ftl), so it has to stand alone.
kcButtonSecondaryClass=clavis-btn clavis-btn--ghost
# Cancel button of application-initiated actions (e.g. login-update-password.ftl).
# kcButtonClass does not always accompany it, so this value has to stand alone
# too.
kcButtonDefaultClass=clavis-btn clavis-btn--ghost

# Alerts
kcAlertClass=clavis-alert
kcAlertTitleClass=clavis-alert__text

# Show/hide password.
# passwordVisibility.js does `icon.className = button.dataset.iconHide`, that is,
# it REPLACES the whole class list: every value has to be self-contained.
kcFormPasswordVisibilityButtonClass=clavis-toggle
kcFormPasswordVisibilityIconShow=clavis-icon clavis-icon--eye
kcFormPasswordVisibilityIconHide=clavis-icon clavis-icon--eye-off

# Language selector
kcLocaleMainClass=clavis-locale
kcLocaleDropDownClass=clavis-locale__dropdown
kcLocaleListClass=clavis-locale__list
kcLocaleItemClass=clavis-locale__item

# Registration and federated identities (the demo realm has both switched off,
# but the inherited templates look these up anyway).
kcSignUpClass=clavis-signup
kcFormSocialAccountSectionClass=clavis-social
kcFormSocialAccountListClass=clavis-social__list
kcFormSocialAccountListButtonClass=clavis-social__link
kcFormSocialAccountNameClass=clavis-social__item
