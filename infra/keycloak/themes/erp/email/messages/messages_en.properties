# English texts for the ERP demo email theme.
#
# This is the reference catalogue: add a key here first, then mirror it in
# messages_es.properties. The two must always hold the same set of keys.
#
# Plain ASCII, like every bundle here: Keycloak reads message bundles as
# ISO-8859-1 unless told otherwise, so any non-ASCII character would have to be
# written as a unicode escape. English needs none.
#
# Keys prefixed with `erp` belong to this theme and are used by our templates.
# Everything not declared here is inherited from the `base` theme, including the
# `linkExpirationFormatter.timePeriodUnit.*` keys that word the expiration.
#
# Every message goes through MessageFormat (even the ones without parameters),
# where a single quote is an escape character. That is why there is not a single
# apostrophe in this file: contractions are spelled out instead.

# --- Shared email layout ----------------------------------------------------
erpEmailBrandBadge=ERP
erpEmailBrandName=ERP Demo
erpEmailBrandTagline=Access managed by Keycloak
erpEmailGreeting=Hello,
erpEmailGreetingNamed=Hello {0},
erpEmailFooterDemo=Demo environment: data is reset whenever the containers are recreated.
erpEmailFooterAuto=This is an automated message; there is no need to reply.

# --- Password recovery ------------------------------------------------------
# Subject line. Keycloak passes no parameters to it, hence no {0}.
passwordResetSubject=Reset your ERP Demo password
erpResetPreheader=Link to choose a new ERP Demo password. It expires in a few minutes.
erpResetTitle=Reset your password
# {0} = realm display name
erpResetIntro=We received a request to change the password of your {0} account.
erpResetCta=Click the button below to choose a new password.
erpResetTextCta=Open this address in your browser to choose a new password:
erpResetButton=Choose a new password
# {0} = expiration already worded by linkExpirationFormatter (e.g. 30 minutes)
erpResetExpiry=For security reasons this link can only be used once and expires in {0}.
erpResetIgnore=If this was not you, just ignore this message: your current password will keep working and nothing will change.
erpResetFallback=If the button does not work, copy and paste this address into your browser:
