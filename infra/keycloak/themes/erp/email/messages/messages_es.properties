# Spanish texts for the ERP demo emails.
#
# messages_en.properties is the reference catalogue: this file mirrors it key by
# key, so anything added there has to be added here as well.
#
# Keycloak reads message bundles as ISO-8859-1, so this file is pure ASCII:
# accents and the enye are written as unicode escapes. That way the text reaches
# the inbox unchanged, whatever encoding the file is read with.
#
# Keys prefixed with `erp` belong to this theme and are used by our templates.
# Anything not declared here is inherited from the `base` theme, including the
# `linkExpirationFormatter.timePeriodUnit.*` keys that word the expiration.
#
# Every message goes through MessageFormat (even the ones without parameters),
# where a single quote is an escape character: that is why not one is used in
# this file.

# --- Shared email layout ----------------------------------------------------
erpEmailBrandBadge=ERP
erpEmailBrandName=ERP Demo
erpEmailBrandTagline=Acceso gestionado por Keycloak
erpEmailGreeting=Hola:
erpEmailGreetingNamed=Hola, {0}:
erpEmailFooterDemo=Entorno de demostraci\u00f3n: los datos se reinician al recrear los contenedores.
erpEmailFooterAuto=Este es un correo autom\u00e1tico; no hace falta que respondas.

# --- Password recovery ------------------------------------------------------
# Subject line. Keycloak passes no parameters to it, hence no {0}.
passwordResetSubject=Restablece tu contrase\u00f1a de ERP Demo
erpResetPreheader=Enlace para elegir una contrase\u00f1a nueva en ERP Demo. Caduca en unos minutos.
erpResetTitle=Restablece tu contrase\u00f1a
# {0} = realm display name
erpResetIntro=Hemos recibido una solicitud para cambiar la contrase\u00f1a de tu cuenta de {0}.
erpResetCta=Pulsa el bot\u00f3n para elegir una contrase\u00f1a nueva.
erpResetTextCta=Abre esta direcci\u00f3n en tu navegador para elegir una contrase\u00f1a nueva:
erpResetButton=Elegir una contrase\u00f1a nueva
# {0} = expiration already worded by linkExpirationFormatter (e.g. 30 minutos)
erpResetExpiry=Por seguridad, este enlace solo se puede usar una vez y caduca en {0}.
erpResetIgnore=Si no has sido t\u00fa, ignora este mensaje: tu contrase\u00f1a actual seguir\u00e1 siendo v\u00e1lida y no se cambiar\u00e1 nada.
erpResetFallback=Si el bot\u00f3n no funciona, copia y pega esta direcci\u00f3n en tu navegador:
