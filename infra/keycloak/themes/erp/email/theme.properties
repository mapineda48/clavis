# Email theme for the ERP demo.
#
# We inherit from `base`, same as the login theme. That way the templates we do
# NOT override (email verification, required actions, event notifications, SMTP
# test...) keep being rendered by Keycloak, but they go through OUR
# html/template.ftl: every message the realm sends shares one layout.
#
# We neither import `common/keycloak` nor declare `styles`: in an email an
# external stylesheet is useless because clients discard it, so all the styling
# lives inline inside the templates.
parent=base

# Languages the demo offers. Must match supportedLocales in the realm so the
# email goes out in the same language the user picked when signing in.
locales=en,es
