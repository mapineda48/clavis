# Tema de correo del demo ERP.
#
# Heredamos de `base`, igual que el tema de login. Asi, las plantillas que NO
# sobrescribimos (verificacion de correo, acciones requeridas, avisos de eventos,
# prueba SMTP...) se siguen renderizando con las de Keycloak, pero pasando por
# NUESTRO html/template.ftl: toda la mensajeria del realm comparte maqueta.
#
# No importamos `common/keycloak` ni declaramos `styles`: en un correo el CSS
# externo no sirve de nada porque los clientes lo descartan, aqui todo el estilo
# va en linea dentro de las plantillas.
parent=base

# Idiomas que ofrece el demo. Deben coincidir con supportedLocales del realm
# para que el correo salga en el mismo idioma que eligio el usuario al entrar.
locales=es,en
