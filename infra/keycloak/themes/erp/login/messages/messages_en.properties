# English texts for the ERP demo login theme.
#
# Kept in plain ASCII on purpose (same rule as messages_es.properties): Keycloak
# reads message bundles as ISO-8859-1 unless told otherwise, so any non-ASCII
# character would have to be written as a unicode escape. This bundle needs none.
#
# Keys prefixed with `erp` belong to this theme. The rest override standard
# Keycloak messages so both languages read the same way.
#
# Messages with parameters ({0}) go through MessageFormat, where single quotes
# must be doubled. They are avoided here.

# --- Branding ---------------------------------------------------------------
erpBrandTitle=ERP Demo
erpBrandTagline=Keycloak governs access end to end: who signs in, with which role, and what they may do on each resource.
erpPointRoles=Composite realm roles: erp-user, erp-manager and erp-admin
erpPointPermissions=Permissions per resource, not per screen
erpPointTokens=JWT tokens verified on every API request

