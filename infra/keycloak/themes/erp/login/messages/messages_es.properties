# Textos en espanol del tema de login del demo ERP.
#
# Keycloak lee los bundles de mensajes como ISO-8859-1 salvo que se le indique lo
# contrario, asi que este archivo es ASCII puro: las tildes, la enye y los signos
# de apertura se escriben como escapes unicode. Asi el texto se ve igual sin
# depender de la codificacion con la que se lea el archivo.
#
# Las claves con prefijo `erp` son propias del tema. Las demas sobrescriben
# mensajes estandar de Keycloak para afinar el tono en espanol.
#
# Los mensajes con parametros ({0}) pasan por MessageFormat: en ellos habria que
# duplicar las comillas simples, por eso aqui no se usa ninguna.

# --- Marca ------------------------------------------------------------------
erpBrandTitle=ERP Demo
erpBrandTagline=El acceso lo gobierna Keycloak de principio a fin: qui\u00e9n entra, con qu\u00e9 rol y qu\u00e9 puede hacer sobre cada recurso.
erpPointRoles=Roles compuestos de realm: erp-user, erp-manager y erp-admin
erpPointPermissions=Permisos por recurso, no por pantalla
erpPointTokens=Tokens JWT verificados en cada petici\u00f3n a la API

# --- Chuleta de usuarios de demostracion ------------------------------------
erpDemoUsersTitle=Usuarios de demostraci\u00f3n
erpUse=Usar
erpUseAria=Rellenar el formulario con el usuario de demostraci\u00f3n {0}
erpDemoUsersNote=Las contrase\u00f1as no se muestran aqu\u00ed: est\u00e1n documentadas en el archivo .env.example del repositorio.

# --- Textos de cada pantalla ------------------------------------------------
erpLoginSubtitle=Entra con una de las cuentas de demostraci\u00f3n y observa c\u00f3mo cambia lo que ves seg\u00fan tu rol.
erpErrorSubtitle=Algo ha fallado durante la autenticaci\u00f3n.
erpPageExpiredSubtitle=El enlace de acceso ha caducado.
erpPageExpiredHint=Por seguridad, los formularios de acceso dejan de ser v\u00e1lidos pasado un rato.
erpRestartLogin=Volver a empezar
erpLogoutSubtitle=Vas a cerrar la sesi\u00f3n en Keycloak y en las aplicaciones conectadas.

# --- Pie de la tarjeta ------------------------------------------------------
erpFooterDemo=Entorno de demostraci\u00f3n: los datos se reinician al recrear los contenedores.
erpFooterSession=La sesi\u00f3n la gestiona Keycloak; la aplicaci\u00f3n solo valida el token que recibe.

# --- Mensajes estandar de Keycloak, con el tono del demo --------------------
loginAccountTitle=Accede a tu cuenta
doLogIn=Entrar
username=Usuario
usernameOrEmail=Usuario o correo electr\u00f3nico
email=Correo electr\u00f3nico
password=Contrase\u00f1a
showPassword=Mostrar la contrase\u00f1a
