# --- Recuperacion de contrasena: subtitulos propios -------------------------
erpResetSubtitle=Te enviaremos por correo un enlace para crear una contrase\u00f1a nueva.
erpUpdatePasswordSubtitle=Elige una contrase\u00f1a nueva para tu cuenta del ERP demo.

# --- Recuperacion de contrasena: mensajes estandar de Keycloak --------------
# doSubmit es generico (lo usan varias pantallas heredadas), por eso el texto
