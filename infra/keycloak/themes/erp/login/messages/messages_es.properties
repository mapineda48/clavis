# Spanish texts for the ERP demo login theme.
#
# messages_en.properties is the reference catalogue: this file mirrors it key by
# key, so anything added there has to be added here as well.
#
# Keycloak reads message bundles as ISO-8859-1 unless told otherwise, so this
# file is pure ASCII: accents, the enye and the opening punctuation marks are
# written as unicode escapes. That way the text renders the same regardless of
# the encoding the file is read with.
#
# Keys prefixed with `erp` belong to this theme. The rest override standard
# Keycloak messages to get the tone right in Spanish.
#
# Messages with parameters ({0}) go through MessageFormat, where single quotes
# would have to be doubled. That is why none are used here.

# --- Branding ---------------------------------------------------------------
erpBrandTitle=ERP Demo
erpBrandTagline=El acceso lo gobierna Keycloak de principio a fin: qui\u00e9n entra, con qu\u00e9 rol y qu\u00e9 puede hacer sobre cada recurso.
erpPointRoles=Roles compuestos de realm: erp-user, erp-manager y erp-admin
erpPointPermissions=Permisos por recurso, no por pantalla
erpPointTokens=Tokens JWT verificados en cada petici\u00f3n a la API

