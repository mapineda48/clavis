emailForgotTitle=Recupera tu contrase\u00f1a
emailInstruction=Escribe tu usuario o tu correo electr\u00f3nico. Si la cuenta existe, el enlace llega en unos segundos y caduca al poco rato: \u00fasalo cuanto antes.
emailInstructionUsername=Escribe tu nombre de usuario. Si la cuenta existe, el enlace llega en unos segundos y caduca al poco rato: \u00fasalo cuanto antes.
emailSentMessage=Si la cuenta existe, en breve recibir\u00e1s un correo con el enlace para crear una contrase\u00f1a nueva.
backToLogin=Volver al inicio de sesi\u00f3n
doSubmit=Continuar
updatePasswordTitle=Crea una contrase\u00f1a nueva
passwordNew=Nueva contrase\u00f1a
passwordConfirm=Confirma la nueva contrase\u00f1a
logoutOtherSessions=Cerrar la sesi\u00f3n en el resto de dispositivos
