# Login theme for the ERP demo.
#
# We inherit from `base` (bare Freemarker templates, no PatternFly) and supply
# our own stylesheet. Importing `common/keycloak` is deliberately avoided: we do
# not use PatternFly, so there is no reason to drag in its CSS or its remote
# fonts.
#
# Anything we do not override (OTP, update password, verify email...) is still
# rendered by the `base` templates, but through OUR template.ftl and with the
# classes mapped below, so the whole flow looks the same.
parent=base

# Languages offered by the selector. Must match supportedLocales in the realm.
locales=en,es

# Local resources only, no CDNs. Served from ${url.resourcesPath}.
styles=css/erp-login.css
scripts=js/erp-login.js

# --- Mapping Keycloak class hooks onto the theme classes ---------------------
# These are the properties the templates inherited from `base` look up
# (`${properties.kcXxxClass!}`). Changing a value here means restarting the
# container: theme.properties is cached even though the .ftl files are not.

# Overall structure
kcHtmlClass=erp-html
kcBodyClass=erp-body
kcFormCardClass=erp-card
kcFormHeaderClass=erp-card__head
kcContentWrapperClass=erp-card__body

# Forms
kcFormGroupClass=erp-field
kcLabelClass=erp-label
kcInputClass=erp-input
kcInputGroup=erp-input-group
kcInputErrorMessageClass=erp-field-error
kcFormOptionsClass=erp-options
kcFormOptionsWrapperClass=erp-options
kcFormSettingClass=erp-options
kcFormButtonsClass=erp-field

# Buttons
kcButtonClass=erp-btn
kcButtonPrimaryClass=erp-btn--primary
kcButtonBlockClass=erp-btn--block
kcButtonLargeClass=erp-btn--lg
# Used WITHOUT kcButtonClass (e.g. in passkeys.ftl), so it has to stand alone.
kcButtonSecondaryClass=erp-btn erp-btn--ghost
# Cancel button of application-initiated actions (e.g. login-update-password.ftl).
# kcButtonClass does not always accompany it, so this value has to stand alone
# too.
kcButtonDefaultClass=erp-btn erp-btn--ghost

# Alerts
kcAlertClass=erp-alert
kcAlertTitleClass=erp-alert__text

# Show/hide password.
# passwordVisibility.js does `icon.className = button.dataset.iconHide`, that is,
# it REPLACES the whole class list: every value has to be self-contained.
kcFormPasswordVisibilityButtonClass=erp-toggle
kcFormPasswordVisibilityIconShow=erp-icon erp-icon--eye
kcFormPasswordVisibilityIconHide=erp-icon erp-icon--eye-off

# Language selector
kcLocaleMainClass=erp-locale
kcLocaleDropDownClass=erp-locale__dropdown
kcLocaleListClass=erp-locale__list
kcLocaleItemClass=erp-locale__item

# Registration and federated identities (the demo realm has both switched off,
# but the inherited templates look these up anyway).
kcSignUpClass=erp-signup
kcFormSocialAccountSectionClass=erp-social
kcFormSocialAccountListClass=erp-social__list
kcFormSocialAccountListButtonClass=erp-social__link
kcFormSocialAccountNameClass=erp-social__item
