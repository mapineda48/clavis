# Tema de login del demo ERP.
#
# Heredamos de `base` (plantillas Freemarker desnudas, sin PatternFly) y aportamos
# nuestra propia hoja de estilos. No importamos `common/keycloak` a proposito: no
# usamos PatternFly, asi que no queremos arrastrar su CSS ni sus fuentes remotas.
#
# Todo lo que no sobrescribimos (OTP, actualizar contrasena, verificar correo...)
# se renderiza con las plantillas de `base` pero con NUESTRO template.ftl y con las
# clases mapeadas mas abajo, de forma que el estilo es coherente en todo el flujo.
parent=base

# Idiomas que ofrece el selector. Deben coincidir con supportedLocales del realm.
locales=es,en

# Recursos locales (sin CDNs). Se sirven desde ${url.resourcesPath}.
styles=css/erp-login.css
scripts=js/erp-login.js

# --- Mapeo de clases de Keycloak a las clases del tema -----------------------
# Estas propiedades son las que consultan las plantillas heredadas de `base`
# (`${properties.kcXxxClass!}`). Cambiar un valor aqui exige reiniciar el
# contenedor: theme.properties se cachea aunque las .ftl no lo hagan.

# Estructura general
kcHtmlClass=erp-html
kcBodyClass=erp-body
kcFormCardClass=erp-card
kcFormHeaderClass=erp-card__head
kcContentWrapperClass=erp-card__body

# Formularios
kcFormGroupClass=erp-field
kcLabelClass=erp-label
kcInputClass=erp-input
kcInputGroup=erp-input-group
kcInputErrorMessageClass=erp-field-error
kcFormOptionsClass=erp-options
kcFormOptionsWrapperClass=erp-options
kcFormSettingClass=erp-options
kcFormButtonsClass=erp-field

# Botones
kcButtonClass=erp-btn
kcButtonPrimaryClass=erp-btn--primary
kcButtonBlockClass=erp-btn--block
kcButtonLargeClass=erp-btn--lg
# Se usa SIN kcButtonClass (p. ej. en passkeys.ftl), asi que debe bastarse solo.
kcButtonSecondaryClass=erp-btn erp-btn--ghost

# Avisos
kcAlertClass=erp-alert
kcAlertTitleClass=erp-alert__text

# Mostrar/ocultar contrasena.
# passwordVisibility.js hace `icono.className = button.dataset.iconHide`, es decir
# REEMPLAZA la clase entera: cada valor tiene que ser un conjunto autosuficiente.
kcFormPasswordVisibilityButtonClass=erp-toggle
kcFormPasswordVisibilityIconShow=erp-icon erp-icon--eye
kcFormPasswordVisibilityIconHide=erp-icon erp-icon--eye-off

# Selector de idioma
kcLocaleMainClass=erp-locale
kcLocaleDropDownClass=erp-locale__dropdown
kcLocaleListClass=erp-locale__list
kcLocaleItemClass=erp-locale__item

# Registro e identidades federadas (el realm del demo los tiene desactivados,
# pero las plantillas heredadas los consultan igualmente).
kcSignUpClass=erp-signup
kcFormSocialAccountSectionClass=erp-social
kcFormSocialAccountListClass=erp-social__list
kcFormSocialAccountListButtonClass=erp-social__link
kcFormSocialAccountNameClass=erp-social__item
