# Tema propio del demo ERP.
#
# Personalizamos las pantallas de login y los correos que envia el realm: los
# tipos restantes (account, admin, welcome) siguen usando los temas que trae
# Keycloak de serie.
#
# Cada tipo declarado tiene su propia carpeta hermana con su theme.properties:
#   login/  -> pantallas de acceso, recuperacion y acciones requeridas
#   email/  -> mensajes salientes (recuperacion de contrasena, verificacion...)
types=login,email
