# Custom theme for the ERP demo.
#
# We only customise the login screens and the emails the realm sends: the
# remaining types (account, admin, welcome) keep using the themes Keycloak
# ships with.
#
# Every type declared here has its own sibling folder with its own
# theme.properties:
#   login/  -> sign-in, password recovery and required-action screens
#   email/  -> outgoing messages (password reset, verification...)
types=login,email
