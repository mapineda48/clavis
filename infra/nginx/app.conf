# Servidor estatico del SPA @erp/app.
# Se copia a /etc/nginx/conf.d/default.conf dentro de la imagen.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Tamano maximo de cuerpo: el SPA no sube nada a nginx (los adjuntos van
    # directos a la API), asi que basta con un limite pequeno.
    client_max_body_size 1m;

    # --- compresion -----------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # --- cabeceras de seguridad basicas --------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- configuracion de runtime --------------------------------------------
    # Lo genera 40-erp-runtime-config.sh en cada arranque: nunca se cachea.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        expires -1;
        try_files $uri =404;
    }

    # --- documento principal --------------------------------------------------
    # Sin cache para que un despliegue nuevo se vea de inmediato.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        expires -1;
        try_files $uri =404;
    }

    # Iframe de comprobacion silenciosa de sesion de Keycloak.
    location = /silent-check-sso.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # --- assets con hash en el nombre ----------------------------------------
    # Vite escribe /assets/<nombre>-<hash>.<ext>: son inmutables.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- sonda de vida del contenedor ----------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- enrutado de la SPA ---------------------------------------------------
    # Cualquier ruta desconocida devuelve index.html para que el router del
    # cliente la resuelva (incluidos los callbacks de Keycloak).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
