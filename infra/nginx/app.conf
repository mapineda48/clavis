# Static server for the @erp/app SPA.
# Copied to /etc/nginx/conf.d/default.conf inside the image.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Maximum body size: the SPA uploads nothing to nginx (attachments go
    # straight to the API), so a small limit is plenty.
    client_max_body_size 1m;

    # --- compression -----------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # --- basic security headers ----------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- runtime configuration -------------------------------------------------
    # Generated by 40-erp-runtime-config.sh on every boot: never cached.
    # It lives on a tmpfs outside the document root so the root can stay
    # read-only; `alias` is what maps the public path onto it.
    location = /config.js {
        alias /run/erp/config.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        expires -1;
    }

    # --- main document ---------------------------------------------------------
    # Uncached so a fresh deploy shows up immediately.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        expires -1;
        try_files $uri =404;
    }

    # Keycloak silent session check iframe.
    location = /silent-check-sso.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # --- hashed assets ---------------------------------------------------------
    # Vite writes /assets/<name>-<hash>.<ext>: those are immutable.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- container liveness probe ----------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- SPA routing -----------------------------------------------------------
    # Any unknown path returns index.html so the client-side router can resolve
    # it (including the Keycloak callbacks).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
