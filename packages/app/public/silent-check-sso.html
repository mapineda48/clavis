<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Silent SSO check</title>
  </head>
  <body>
    <!--
      keycloak-js loads this page inside a hidden iframe during `check-sso`.
      Its only job is to hand the return URL (carrying the code or the error)
      back to the main window, which is what completes the PKCE exchange.
    -->
    <script>
      parent.postMessage(location.href, location.origin)
    </script>
  </body>
</html>
