# Packages that make up the monorepo workspace.
packages:
  - "packages/*"

# pnpm 10+ blocks dependency install scripts (preinstall/install/postinstall) by
# default. Only the ones that genuinely need them to link their native binary are
# approved here, explicitly and under version control: esbuild is the one Vite uses
# underneath.
allowBuilds:
  esbuild: true

# Packages exempted from the minimum publish-age policy.
# Pinned here so the install is reproducible without manual intervention.
minimumReleaseAgeExclude:
  - '@types/pg@8.20.2'
  - jose@6.2.6
  - '@tanstack/react-router@1.170.22'
  - '@tanstack/router-core@1.171.19'
